name: DB Recovery - Auto Sitemap Deploy

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: 'Regenerate after a successful authenticated DB check (never bypass auth)'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: sitemap-production
  cancel-in-progress: false

jobs:
  check-db-and-deploy-sitemap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write # Only this job pushes public/sitemap.xml; no PAT/admin scope.
    defaults:
      run:
        shell: bash
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://yitmabzsxfgbchhhjjef.supabase.co
      NEXT_PUBLIC_SITE_URL: https://cloudpipemo.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate deployment configuration
        id: preflight
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_REVALIDATE_TOKEN: ${{ secrets.VERCEL_REVALIDATE_TOKEN }}
        run: python3 scripts/sitemap-deploy.py preflight

      - name: Check authenticated DB data access
        id: db_check
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/sitemap-deploy.py db

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Generate Sitemap
        id: generate
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITEMAP_STRICT: 'true'
          SITEMAP_STATS_PATH: /tmp/sitemap-stats.json
        run: |
          set -euo pipefail
          node scripts/generate-sitemap.js 2>&1 | tee /tmp/sitemap-output.txt
          python3 scripts/sitemap-deploy.py generated

      - name: Commit and push sitemap
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/sitemap.xml
          changed=false
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-regenerate sitemap after authenticated DB check"
            git push origin HEAD:main
            changed=true
          fi
          # This receipt is written only after push succeeds (or confirmed no change).
          export SITEMAP_CHANGED="$changed"
          export SITEMAP_COMMIT_SHA="$(git rev-parse HEAD)"
          python3 scripts/sitemap-deploy.py pushed

      - name: Confirm Vercel production deployment and alias
        id: deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: python3 scripts/sitemap-deploy.py deployment

      - name: Revalidate Vercel sitemap routes
        id: revalidate
        env:
          VERCEL_REVALIDATE_TOKEN: ${{ secrets.VERCEL_REVALIDATE_TOKEN }}
        run: python3 scripts/sitemap-deploy.py revalidate

      - name: Verify online sitemap index and every child
        id: verify
        run: python3 scripts/sitemap-deploy.py verify

      - name: Submit sitemap to Google Search Console
        id: google
        if: success() && steps.verify.outcome == 'success'
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_SEARCH_CONSOLE_SITE_URL: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SITE_URL }}
        run: python3 scripts/sitemap-deploy.py google

      - name: Submit sitemap to Bing Webmaster Tools
        id: bing
        if: always() && !cancelled() && steps.verify.outcome == 'success'
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: python3 scripts/sitemap-deploy.py bing

      - name: Submit content URLs to IndexNow
        id: indexnow
        if: always() && !cancelled() && steps.verify.outcome == 'success'
        env:
          BING_INDEXNOW_KEY: ${{ secrets.BING_INDEXNOW_KEY }}
        run: python3 scripts/sitemap-deploy.py indexnow

      - name: Send actual stage results by email
        id: notify
        if: always() && !cancelled() && steps.preflight.outcome != 'skipped'
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: python3 scripts/sitemap-deploy.py notify

      - name: Workflow Summary
        if: always()
        env:
          GENERATE_OUTCOME: ${{ steps.generate.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
        run: |
          python3 scripts/sitemap-deploy.py summary
          echo "- Generation step: $GENERATE_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Git commit/push step: $COMMIT_OUTCOME" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve deployment receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitemap-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/sitemap-deploy-state.json
            /tmp/sitemap-stats.json
            /tmp/sitemap-output.txt
          if-no-files-found: warn
          retention-days: 30
